<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f2" />

    <!-- Theme bootstrap — applies the saved (or system) theme before first paint so
         there is no light flash on dark mode. Keep in sync with src/hooks/useTheme.js -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('samprt-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#16140f' : '#f6f5f2');
        } catch (error) {
          /* localStorage unavailable — keep the light default */
        }
      })();
    </script>
    
    <!-- SEO Meta Tags -->
    <title>Samprit Mandal — Next Gen AI/ML Innovator</title>
    <meta name="description" content="Portfolio of Samprit Mandal — Next Gen AI/ML Innovator and Full Stack Developer specializing in React, Node.js, Python, and Machine Learning. Building scalable full-stack applications with modern architecture." />
    <meta name="keywords" content="Samprit Mandal, Next Gen AI ML Innovator, AI/ML, Machine Learning, Full Stack Developer, MERN, React, Node.js, Python, Software Engineer, Portfolio, Kolkata" />
    <meta name="author" content="Samprit Mandal" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Samprit Mandal" />
    <meta property="og:description" content="Next Gen AI/ML Innovator and Full Stack Developer specializing in React, Node.js, Python, and Machine Learning. Building scalable full-stack applications." />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
